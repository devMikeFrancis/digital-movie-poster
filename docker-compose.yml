# Local development stack. The Raspberry Pi install does not use Docker.
services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        ports:
            - '${APP_PORT:-8074}:80'
            - '${VITE_PORT:-5173}:5173'
        environment:
            DB_CONNECTION: sqlite
            REDIS_HOST: redis
            BROADCAST_CONNECTION: redis
            QUEUE_CONNECTION: redis
        volumes:
            - '.:/var/www/html'
        depends_on:
            redis:
                condition: service_healthy

    socket:
        build:
            context: .
            dockerfile: docker/Dockerfile
        command: node socketserver/server.js
        ports:
            - '3000:3000'
        environment:
            REDIS_HOST: redis
            SOCKET_ALLOWED_ORIGINS: '*'
        volumes:
            - '.:/var/www/html'
        depends_on:
            redis:
                condition: service_healthy

    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'dmp-redis:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

volumes:
    dmp-redis:
        driver: local
